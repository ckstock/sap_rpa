<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAP 自动化执行门户</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --panel-soft: #fafcff;
      --line: #e5e7eb;
      --line-strong: #cbd5e1;
      --text: #1f2937;
      --muted: #667085;
      --nav: #001529;
      --nav-soft: #002140;
      --blue: #1890ff;
      --blue-dark: #096dd9;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --cyan: #0891b2;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      --radius: 8px;
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .icon { width: 17px; height: 17px; flex: 0 0 auto; }
    .hidden { display: none !important; }

    .login-page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 440px) minmax(0, 1fr);
      background:
        linear-gradient(135deg, rgba(24, 144, 255, .88), rgba(54, 207, 201, .72)),
        url("https://images.unsplash.com/photo-1517048676732-d65bc937f952?auto=format&fit=crop&w=1600&q=80") center/cover;
    }
    .login-panel {
      background: rgba(255,255,255,.98);
      padding: 46px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-right: 1px solid rgba(255,255,255,.36);
    }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 8px;
      background: var(--blue); color: #fff; display: grid; place-items: center;
    }
    .login-brand h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    .login-brand p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .login-form { display: grid; gap: 14px; }
    .login-side {
      color: #fff;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 520px;
    }
    .login-side h2 { margin: 0 0 14px; font-size: 40px; line-height: 1.16; }
    .login-side p { margin: 0; max-width: 650px; color: rgba(255,255,255,.88); line-height: 1.8; }
    .divider {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      color: var(--muted); font-size: 12px; margin: 4px 0;
    }
    .divider::before, .divider::after { content: ""; height: 1px; background: var(--line); }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh;
      background: var(--nav);
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .logo {
      height: 72px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      font-weight: 700;
      font-size: 18px;
    }
    .logo .brand-mark { width: 36px; height: 36px; }
    .nav { padding: 0; display: grid; gap: 0; }
    .nav button {
      height: 56px; width: 100%;
      border: 0; border-radius: 0;
      background: transparent; color: #cbd5e1;
      display: flex; align-items: center; gap: 10px;
      padding: 0 18px; text-align: left;
      font-size: 16px;
    }
    .nav button:hover { background: var(--nav-soft); color: #fff; }
    .nav button.active { background: var(--blue); color: #fff; box-shadow: none; }
    .main { min-width: 0; padding: 18px 22px 32px; }
    .topbar {
      min-height: 58px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(15, 23, 42, .04);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .breadcrumb { color: var(--muted); font-size: 13px; }
    .page-title { font-weight: 700; color: var(--text); }
    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #e6f7ff; color: #0958d9;
      display: grid; place-items: center;
      font-weight: 700; font-size: 13px;
    }
    .identity-pill {
      display: inline-flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      min-width: 108px;
      max-width: 180px;
      line-height: 1.15;
    }
    .identity-name {
      font-weight: 700;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .identity-ddid {
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      min-height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(24,144,255,.28); }
    .btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; box-shadow: 0 4px 12px rgba(24,144,255,.34); }
    .btn.green { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.red { background: var(--red); border-color: var(--red); color: #fff; }
    .btn.small { min-height: 30px; padding: 0 9px; font-size: 12px; }
    .btn:disabled { opacity: .58; cursor: not-allowed; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
      color: var(--text);
      min-height: 38px;
      padding: 9px 11px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(24, 144, 255, .12);
    }
    label { color: #344054; font-size: 13px; font-weight: 600; }
    .field { display: grid; gap: 7px; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .form-grid .span-2 { grid-column: span 2; }
    .form-grid .span-3 { grid-column: 1 / -1; }
    .radio-row, .check-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .radio-chip {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      padding: 0 10px;
      background: #fff;
      font-weight: 500;
    }
    .radio-chip input { width: auto; min-height: 0; }
    .select-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; align-items: start; }
    .factory-list { display: grid; gap: 8px; }
    .factory-button {
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: #fff;
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--text);
      text-align: left;
    }
    .factory-button:hover, .factory-button.active { border-color: #91d5ff; background: #e6f7ff; color: #0958d9; }
    .plant-picker { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .checkbox-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 11px 12px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 9px;
      align-items: start;
      min-height: 70px;
    }
    .checkbox-card input { width: auto; min-height: 0; margin-top: 3px; }
    .checkbox-card strong { display: block; color: #102a43; }
    .checkbox-card span { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; margin-top: 3px; }
    .area-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .area-chip {
      min-height: 28px;
      display: inline-flex;
      align-items: center;
      border-radius: 4px;
      border: 1px solid #91d5ff;
      background: #e6f7ff;
      color: #0958d9;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 600;
    }
    .run-summary {
      border: 1px solid #91d5ff;
      background: #f0f8ff;
      border-radius: var(--radius);
      padding: 12px;
      display: grid;
      gap: 9px;
      font-size: 13px;
    }
    .summary-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: start; }
    .summary-row span:first-child { color: var(--muted); }
    .summary-row strong { color: #102a43; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 2px 10px rgba(15, 23, 42, .04);
      overflow: hidden;
    }
    .panel + .panel { margin-top: 16px; }
    .panel-header {
      min-height: 52px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      background: #fafcff;
    }
    .panel-title { display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .panel-sub { color: var(--muted); font-size: 12px; margin-top: 2px; line-height: 1.5; }
    .panel-body { padding: 16px; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 15px;
      display: grid;
      gap: 7px;
    }
    .metric .label { color: var(--muted); font-size: 12px; }
    .metric .value { font-size: 23px; font-weight: 800; }
    .metric .hint { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .agent-v2-entry {
      border: 1px solid #d9e5f2;
      border-radius: var(--radius);
      background: #f8fbff;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .agent-v2-main { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .agent-v2-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #e6f7ff;
      color: var(--blue);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .agent-v2-copy { display: grid; gap: 2px; min-width: 0; }
    .agent-v2-title { color: #102a43; font-size: 14px; font-weight: 700; }
    .agent-v2-desc { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .quick-actions { display: grid; grid-template-columns: repeat(4, minmax(170px, 1fr)); gap: 12px; }
    .action-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 86px;
      transition: border-color .16s, box-shadow .16s, transform .16s;
    }
    .action-card:hover { border-color: #91d5ff; box-shadow: 0 4px 14px rgba(15, 23, 42, .07); transform: translateY(-1px); }
    .action-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .action-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #f5f8fc;
      color: var(--blue);
      display: grid;
      place-items: center;
      border: 1px solid #e3edf8;
      flex: 0 0 auto;
    }
    .action-icon .icon { width: 18px; height: 18px; }
    .action-copy { display: grid; gap: 3px; min-width: 0; }
    .action-name { font-weight: 800; font-size: 15px; color: #102a43; line-height: 1.25; }
    .action-desc { color: var(--muted); font-size: 12px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .action-card .btn { flex: 0 0 auto; }
    .execute-shell { display: grid; gap: 16px; }
    .execute-form-grid { display: grid; grid-template-columns: minmax(220px, 360px); gap: 16px; max-width: 360px; }
    .execute-range {
      border: 1px solid #91d5ff;
      background: #eef8ff;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: grid;
      gap: 10px;
    }
    .execute-range-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .execute-range-label { color: #475467; line-height: 28px; }
    .execute-range-value { color: #102a43; font-weight: 800; line-height: 28px; }
    .execute-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .transaction-groups { display: grid; gap: 18px; }
    .transaction-group {
      display: grid;
      gap: 14px;
      padding: 2px 0 8px;
    }
    .transaction-group + .transaction-group { border-top: 1px solid #eef2f7; padding-top: 18px; }
    .transaction-group-head {
      color: #102a43;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      line-height: 1.3;
    }
    .transaction-group-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .workflow-index {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e8f3ff;
      color: var(--blue);
      font-weight: 900;
      flex: 0 0 auto;
    }
    .transaction-group-name { font-size: 18px; font-weight: 900; }
    .transaction-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 230px));
      gap: 18px;
      justify-content: start;
      overflow: visible;
    }
    .transaction-card {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      padding: 14px 16px 16px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      justify-items: center;
      text-align: center;
      gap: 9px;
      min-height: 190px;
      position: relative;
      transition: border-color .18s, box-shadow .18s, transform .18s;
    }
    .transaction-card:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: -15px;
      top: 50%;
      transform: translateY(-50%);
      color: #91a4b7;
      font-weight: 900;
      font-size: 18px;
      z-index: 1;
    }
    .transaction-card:hover {
      border-color: #b7d9ff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, .12);
      transform: translateY(-4px);
    }
    .transaction-step {
      color: #667085;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
      justify-self: start;
    }
    .transaction-card-head { display: contents; }
    .transaction-card .action-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      margin-bottom: 2px;
    }
    .transaction-card .action-icon .icon { width: 20px; height: 20px; }
    .transaction-meta { display: contents; }
    .transaction-code { font-size: 17px; font-weight: 800; color: #102a43; line-height: 1.25; overflow-wrap: anywhere; }
    .transaction-name {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .transaction-note {
      color: #175cd3;
      font-size: 12px;
      line-height: 1.35;
      min-height: 16px;
      overflow-wrap: anywhere;
    }
    .transaction-tags { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; min-height: 28px; }
    .transaction-card .btn { justify-self: center; margin-top: 4px; }
    .report-toolbar { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .report-toolbar .field { min-width: 170px; }
    .report-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .report-metric {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 16px;
      display: grid;
      gap: 6px;
      min-height: 92px;
    }
    .report-metric-value { font-size: 26px; font-weight: 800; color: #1677ff; }
    .report-metric-label { color: var(--muted); font-size: 13px; }
    .param-preview { display: grid; gap: 10px; }
    .param-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .param-item {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
      background: #fff;
      min-height: 58px;
      display: grid;
      gap: 4px;
    }
    .param-label { color: var(--muted); font-size: 12px; }
    .param-value { color: #102a43; font-weight: 700; overflow-wrap: anywhere; }
    .workflow-map {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .workflow-stage {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fbff;
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 10px;
      min-height: 260px;
    }
    .stage-head { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #102a43; }
    .stage-num {
      width: 24px; height: 24px; border-radius: 50%;
      background: #e6f7ff; color: var(--blue);
      display: grid; place-items: center;
      font-size: 12px;
      flex: 0 0 auto;
    }
    .logic-list { display: grid; gap: 8px; }
    .logic-node {
      border: 1px solid #d9e5f2;
      border-radius: var(--radius);
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 4px;
    }
    .logic-node strong { color: #102a43; font-size: 14px; }
    .logic-node span { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .logic-node.primary { border-color: #91d5ff; background: #f0f8ff; }
    .logic-node.check { border-color: #b7eb8f; background: #f6ffed; }
    .logic-note { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .executor-stack { display: grid; gap: 10px; }
    .executor-row {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
    }
    .launch-link {
      border: 1px solid #91d5ff;
      background: #e6f7ff;
      border-radius: var(--radius);
      padding: 10px 12px;
      color: #0958d9;
      font-family: Consolas, "Microsoft YaHei UI", monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
      line-height: 1.55;
    }
    .badge, .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .badge.viewer { background: #e6f7ff; color: #0958d9; border-color: #91d5ff; }
    .badge.executor { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
    .tag.ok { background: #f6ffed; color: #389e0d; border-color: #b7eb8f; }
    .tag.info { background: #e6f7ff; color: #0958d9; border-color: #91d5ff; }
    .tag.warn { background: #fffbe6; color: #ad6800; border-color: #ffe58f; }
    .tag.err { background: #fff1f0; color: #cf1322; border-color: #ffa39e; }
    .notice {
      border: 1px solid #91d5ff;
      background: #e6f7ff;
      color: #0958d9;
      border-radius: var(--radius);
      padding: 12px 14px;
      line-height: 1.65;
      font-size: 13px;
    }
    .notice.warn { border-color: #ffe58f; background: #fffbe6; color: #ad6800; }
    .notice.ok { border-color: #b7eb8f; background: #f6ffed; color: #237804; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; vertical-align: middle; }
    th { background: #f5f7fa; color: #475467; font-weight: 700; }
    tbody tr:hover { background: #f5f8ff; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tab {
      border: 1px solid var(--line-strong);
      background: #fff;
      border-radius: var(--radius);
      min-height: 34px;
      padding: 0 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .tab.active { color: var(--blue); border-color: #91d5ff; background: #e6f7ff; }
    .config-status {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .config-status-main { display: grid; gap: 4px; min-width: 0; }
    .config-status-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #102a43; }
    .config-status-sub { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .config-section { display: grid; gap: 10px; }
    .config-section + .config-section { margin-top: 16px; }
    .config-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 36px;
    }
    .config-section-title { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #102a43; }
    .inline-actions { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .empty-cell { color: var(--muted); text-align: center; padding: 18px 12px; }
    .secret-state { color: #102a43; font-weight: 700; }
    .table-hint { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .steps { display: grid; gap: 10px; }
    .queue-strip {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fbff;
      padding: 10px 12px;
      display: grid;
      gap: 6px;
      font-size: 13px;
    }
    .queue-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .queue-main { color: #102a43; font-weight: 700; }
    .queue-meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
    .queue-meta span { white-space: nowrap; }
    .step {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      min-height: 38px;
    }
    .step-icon {
      width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center;
      background: #e5e7eb; color: #64748b;
      font-size: 12px; font-weight: 800;
    }
    .step.done .step-icon { background: #dcfce7; color: var(--green); }
    .step.run .step-icon { background: #dbeafe; color: var(--blue); animation: pulse 1.2s infinite; }
    .step.fail .step-icon { background: #fee2e2; color: var(--red); }
    .step-text { font-size: 13px; }
    .step-time { font-size: 12px; color: var(--muted); }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.92); opacity: .7; } }
    .log {
      background: #101828;
      color: #d0d5dd;
      border-radius: var(--radius);
      padding: 12px;
      height: 248px;
      overflow: auto;
      font-family: Consolas, "Microsoft YaHei UI", monospace;
      font-size: 12px;
      line-height: 1.7;
    }
    .log-line { border-bottom: 1px solid rgba(255,255,255,.07); padding: 2px 0; }
    .log-time { color: #86efac; margin-right: 8px; }
    .log .INFO { color: #93c5fd; }
    .log .OK { color: #86efac; }
    .log .WARN { color: #fcd34d; }
    .log .ERR { color: #fca5a5; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(15, 23, 42, .48);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .modal {
      width: min(720px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    .modal-header, .modal-footer {
      min-height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .modal-footer { border-top: 1px solid var(--line); border-bottom: 0; justify-content: flex-end; gap: 10px; }
    .modal-body { padding: 16px; }
    .rule-plant-editor {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fafcff;
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .rule-plant-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .rule-plant-title { color: #102a43; font-weight: 800; }
    .rule-plant-add { display: flex; gap: 8px; align-items: center; max-width: 360px; }
    .rule-plant-add input { min-width: 150px; }
    .schedule-plant-preview {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fafcff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }
    .schedule-plant-title { color: #102a43; font-weight: 800; }
    .area-chip.editable { gap: 6px; padding-right: 4px; }
    .chip-x {
      width: 18px;
      height: 18px;
      min-width: 18px;
      border: 1px solid rgba(9, 88, 217, .28);
      border-radius: 4px;
      background: #fff;
      color: #063f9e;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
    }
    .chip-x:hover,
    .chip-x:focus-visible {
      background: #d6eaff;
      border-color: #1677ff;
      outline: none;
    }
    .advanced-settings {
      grid-column: 1 / -1;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fafbfc;
    }
    .advanced-settings summary {
      min-height: 38px;
      padding: 0 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #475467;
      font-weight: 700;
      font-size: 13px;
    }
    .advanced-settings .advanced-body {
      border-top: 1px solid var(--line);
      padding: 14px;
    }
    .toast-wrap {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      display: grid;
      gap: 8px;
    }
    .toast {
      min-width: 260px;
      max-width: 420px;
      background: #fff;
      border: 1px solid var(--line);
      border-left: 4px solid var(--blue);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: var(--text);
      line-height: 1.5;
      font-size: 13px;
    }
    .toast.ok { border-left-color: var(--green); }
    .toast.warn { border-left-color: var(--amber); }
    .toast.err { border-left-color: var(--red); }
    @media (max-width: 1400px) {
      .transaction-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 1120px) {
      .quick-actions, .workflow-map, .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .transaction-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .transaction-card::after { display: none; }
      .param-grid { grid-template-columns: 1fr; }
      .grid.cols-3, .grid.cols-2 { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-grid .span-2 { grid-column: auto; }
      .form-grid .span-3 { grid-column: auto; }
      .select-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .login-page { grid-template-columns: 1fr; }
      .login-side { display: none; }
      .login-panel { min-height: 100vh; padding: 28px 20px; }
      .app-shell { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; }
      .nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { padding: 12px; }
      .topbar { align-items: flex-start; flex-direction: column; padding: 12px; }
      .quick-actions, .workflow-map, .grid.cols-4, .transaction-grid { grid-template-columns: 1fr; }
      .transaction-group-head { align-items: flex-start; flex-direction: column; }
      .agent-v2-entry { align-items: flex-start; flex-direction: column; }
      .plant-picker { grid-template-columns: 1fr; }
    }
  </style>
</head>
